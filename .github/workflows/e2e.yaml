name: E2E

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: DSH host · install · boot · restart · Settings UI
    # Only after the lint/typecheck/build/test pipeline (workflow "CI") passed,
    # and only for main — PRs get the fast quality gates.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — install into DSH host, boot, restart, verify Settings UI
        env:
          E2E_SHOTS: ${{ github.workspace }}/e2e-shots
        run: node scripts/e2e.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
